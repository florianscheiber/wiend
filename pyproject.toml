[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiend"
version = "0.1.0"
authors = [{name="Florian Scheiber"}]
description = "ERA5 wind download, downscaling and bias correction using Weibull parameter maps."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "dask>=2024.0",
    "scipy>=1.11",
    "xarray>=2022.0",
    "numpy>=1.21",
    "fsspec>=2023.0",
    "aiohttp>=3.9",
    "requests>=2.31",
    "zarr>=2.10",
    "tqdm>=4.50",
]
urls = { "Repository" = "https://github.com/florianscheiber/wiend" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]