[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiend"
version = "0.1.0"
description = "ERA5 wind download, downscaling and bias correction using Weibull parameter maps."
requires-python = ">=3.11"
license = { text = "MIT" }
urls = { "Repository" = "https://github.com/florianscheiber/wiend" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]